spring:
  application:
    name: backend

  # Local secrets live in backend/.env, which is git-ignored. The `[.properties]` hint is required:
  # without it Spring tries to parse the file as YAML and fails on `KEY=value` lines. `optional:`
  # keeps startup working when the file is absent, which is what CI and production rely on --
  # there the same variables come from the real environment instead.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:whatsapp_clone}
    username: ${POSTGRES_USER:whatsapp_user}
    password: ${POSTGRES_PASSWORD:whatsapp_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: whatsapp-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    # Override in every non-local environment. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
    issuer: whatsapp-clone
    access-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  messaging:
    # STOMP broker relay. Running more than one app instance requires this, otherwise each
    # instance only sees the messages published by its own in-memory broker.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_USER:whatsapp}
    passcode: ${RABBITMQ_PASSWORD:whatsapp_secret}
    virtual-host: ${RABBITMQ_VHOST:/}
    heartbeat-send-interval: 10000
    heartbeat-receive-interval: 10000
  encryption:
    # Encrypts message content at rest. This is server-side encryption, not end-to-end:
    # the application decrypts on read. Override outside local dev.
    content-key: ${MESSAGE_ENCRYPTION_KEY:dev-only-content-key-0123456789abcdef}
  presence:
    key-prefix: "presence:"
  media:
    # Private S3 bucket. Leave MEDIA_BUCKET empty to run without media: the endpoints then return
    # MEDIA_NOT_CONFIGURED (503) instead of failing startup, so frontend work is never blocked on
    # AWS being set up. Credentials come from the AWS SDK default provider chain — never configure
    # them here, and never expose them to a browser.
    bucket: ${MEDIA_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    # Short because a signed URL is a bearer token for one object. The download TTL is deliberately
    # not cache-friendly; a CDN in front of the bucket is the fix if that becomes a problem.
    upload-url-ttl: ${MEDIA_UPLOAD_URL_TTL:5m}
    download-url-ttl: ${MEDIA_DOWNLOAD_URL_TTL:15m}
    max-bytes: ${MEDIA_MAX_BYTES:26214400}
    # Extensions are pinned here rather than derived from the media type, so a client cannot choose
    # the stored object's suffix.
    allowed-content-types: ${MEDIA_ALLOWED_CONTENT_TYPES:image/jpeg=jpg,image/png=png,image/webp=webp,image/gif=gif,video/mp4=mp4,video/webm=webm,audio/mpeg=mp3,audio/mp4=m4a,audio/ogg=ogg,audio/webm=webm}

logging:
  level:
    org.hibernate.SQL: INFO